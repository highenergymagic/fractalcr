name: Source checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  management:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: false
      - run: go test -mod=vendor -race ./...
      - run: go vet -mod=vendor ./...
      - name: Exercise command and configuration parsers
        run: |
          go test -mod=vendor ./internal/cli -run='^$' -fuzz=FuzzResolveAndHelp -fuzztime=30s -parallel=2
          go test -mod=vendor ./internal/config -run='^$' -fuzz=FuzzDecodeRoundTrip -fuzztime=30s -parallel=2
      - name: Verify vendored dependencies
        run: |
          go mod download
          go mod verify
          go mod vendor
          git diff --exit-code -- go.mod go.sum vendor
          test -z "$(git ls-files --others --exclude-standard vendor)"
      - name: Reachability-aware Go vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
  integration:
    # Private component credentials are never supplied to pull request code.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - id: pins
        shell: bash
        run: |
          echo "boot=$(git ls-tree HEAD boot | awk '{print $3}')" >> "$GITHUB_OUTPUT"
          echo "service=$(git ls-tree HEAD service | awk '{print $3}')" >> "$GITHUB_OUTPUT"
          echo "layer=$(git ls-tree HEAD os/meta-fractal | awk '{print $3}')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: highenergymagic/fractalcr-rommon
          ref: ${{ steps.pins.outputs.boot }}
          path: boot
          ssh-key: ${{ secrets.ROMMON_READ_KEY }}
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: highenergymagic/fractalcr-supervisor
          ref: ${{ steps.pins.outputs.service }}
          path: service
          ssh-key: ${{ secrets.SUPERVISOR_READ_KEY }}
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: highenergymagic/meta-fractalcr
          ref: ${{ steps.pins.outputs.layer }}
          path: os/meta-fractal
          ssh-key: ${{ secrets.LAYER_READ_KEY }}
          persist-credentials: false
      - name: Install integration dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libjson-c-dev libblkid-dev libssl-dev python3-cryptography
      - run: /usr/bin/python3 -m unittest discover -s tools/tests -v
      - name: Compile and test C services
        run: |
          sudo ln -s "$GITHUB_WORKSPACE" /src
          sudo bash tools/check-services.sh
          sudo env FCR_SANITIZE=1 bash tools/check-services.sh
      - name: Reject forged and retired image envelopes
        run: |
          sudo mkdir -p /work/build
          sudo ln -s "$GITHUB_WORKSPACE/boot" /work/boot
          sudo bash boot/tools/make-dev-keys.sh >/dev/null 2>&1
          sudo /usr/bin/python3 boot/tests/test-verifier.py
          sudo env FCR_SANITIZE=1 /usr/bin/python3 boot/tests/test-verifier.py
