name: Source checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  management:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.10'
          cache: false
      - run: go test -mod=vendor -race ./...
      - run: go vet -mod=vendor ./...
      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck=
      - name: Reject mismatched firmware qualification evidence
        run: python3 -m unittest discover -s tools/tests -p test_management_qualification.py -v
      - name: Verify CLI catalogs match linked API clients
        run: |
          go build -mod=vendor -o /tmp/fractal-workload ./cmd/fractal-workload
          /tmp/fractal-workload catalog > /tmp/workload-catalog.json
          /tmp/fractal-workload build-catalog > /tmp/buildkit-catalog.json
          cmp internal/cli/workload-catalog.json /tmp/workload-catalog.json
          cmp internal/cli/buildkit-catalog.json /tmp/buildkit-catalog.json
      - name: Exercise command and configuration parsers
        run: |
          go test -mod=vendor ./internal/cli -run='^$' -fuzz=FuzzResolveAndHelp -fuzztime=30s -parallel=2
          go test -mod=vendor ./internal/config -run='^$' -fuzz=FuzzDecodeRoundTrip -fuzztime=30s -parallel=2
      - name: Verify vendored dependencies
        run: |
          go mod download
          go mod verify
          go mod vendor
          python3 tools/apply-vendor-api.py
          git diff --exit-code -- go.mod go.sum vendor
          test -z "$(git ls-files --others --exclude-standard vendor)"
      - name: Reachability-aware Go vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck -json ./cmd/... ./internal/... ./pkg/... > govulncheck.json
          python3 tools/security/check-go-findings.py govulncheck.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: management-vulnerability-report
          path: govulncheck.json
          if-no-files-found: ignore
  integration:
    # Run the heavier integration checks on main; component checkouts are public.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - id: pins
        shell: bash
        run: |
          echo "boot=$(git ls-tree HEAD boot | awk '{print $3}')" >> "$GITHUB_OUTPUT"
          echo "service=$(git ls-tree HEAD service | awk '{print $3}')" >> "$GITHUB_OUTPUT"
          echo "layer=$(git ls-tree HEAD os/meta-fractal | awk '{print $3}')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: highenergymagic/fractalcr-rommon
          ref: ${{ steps.pins.outputs.boot }}
          path: boot
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: highenergymagic/fractalcr-supervisor
          ref: ${{ steps.pins.outputs.service }}
          path: service
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: highenergymagic/meta-fractalcr
          ref: ${{ steps.pins.outputs.layer }}
          path: os/meta-fractal
          persist-credentials: false
      - name: Install integration dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libjson-c-dev libblkid-dev libssl-dev python3-cryptography
      - run: /usr/bin/python3 -m unittest discover -s tools/tests -v
      - name: Verify sparse seed encoding is allocation independent
        run: /usr/bin/python3 os/tests/test-block-seed.py
      - name: Compile and test C services
        run: |
          sudo ln -s "$GITHUB_WORKSPACE" /src
          sudo bash tools/check-services.sh
          sudo env FCR_SANITIZE=1 bash tools/check-services.sh
      - name: Reject forged and retired image envelopes
        run: |
          sudo mkdir -p /work/build
          sudo ln -s "$GITHUB_WORKSPACE/boot" /work/boot
          sudo bash boot/tools/make-dev-keys.sh >/dev/null 2>&1
          sudo /usr/bin/python3 boot/tests/test-verifier.py
          sudo env FCR_SANITIZE=1 /usr/bin/python3 boot/tests/test-verifier.py
