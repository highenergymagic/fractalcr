name: Dependency discovery
on:
  schedule:
    - cron: '19 8 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - id: pins
        run: |
          echo "boot=$(git ls-tree HEAD boot | awk '{print $3}')" >> "$GITHUB_OUTPUT"
          echo "layer=$(git ls-tree HEAD os/meta-fractal | awk '{print $3}')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: highenergymagic/fractalcr-rommon
          ref: ${{ steps.pins.outputs.boot }}
          path: boot
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: highenergymagic/meta-fractalcr
          ref: ${{ steps.pins.outputs.layer }}
          path: os/meta-fractal
          persist-credentials: false
      - run: python3 tools/dependencies.py discover --output out/dependency-report.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-report
          path: out/dependency-report.json
          retention-days: 30
